apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dawaabank-ingress
spec:
  ingressClassName: nginx      # must match `kubectl get ingressclass`
  rules:
  - host: logic.dawaabank.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dawaabank-app-svc
            port:
              number: 80
