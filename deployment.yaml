apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawaabank-app
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dawaabank-app
  template:
    metadata:
      labels:
        app: dawaabank-app
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: dawaabank-app
      containers:
      - name: app
        image: 0abdulah0/dawaabank:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9091
        envFrom:
        - configMapRef:
            name: dawaabank-config
        - secretRef:
            name: dawaabank-secret
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9091
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9091
          initialDelaySeconds: 40
          periodSeconds: 10
          failureThreshold: 30
